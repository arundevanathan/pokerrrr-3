name: Release production manually

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Full 40-character commit SHA verified on staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dunzo-club-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "A full 40-character commit SHA is required" >&2
            exit 1
          fi

      - name: Checkout approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: |
          pnpm test
          pnpm test:production
          pnpm typecheck

      - name: Build and verify production artifact
        run: |
          pnpm build:production
          pnpm check:production

      - name: Deploy approved production release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm deploy:production
